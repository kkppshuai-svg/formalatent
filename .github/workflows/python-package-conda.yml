name: Python tests

on: [push]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.2,<3'
          python -m pip install -r requirements-dev.txt -r requirements-graph.txt flake8
      - name: Lint with flake8
        run: python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test with pytest
        env:
          PYTHONPATH: scripts
        run: python -m pytest scripts -q
