<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="485" viewBox="0 0 1120 485" role="img" aria-labelledby="title desc">
<title id="title">FormaLatent 几何与结构双通道</title><desc id="desc">几何 VAE 和结构 VAE 分别训练。STEP 描述和结构标签各自编码为潜向量，用于相似检索和描述重建，不生成完整实体。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8d9daf"/></marker></defs>
<rect width="1120" height="485" rx="14" fill="#f7f9fc"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="26" y="43" font-size="13" fill="#526477" letter-spacing="1">FORMALATENT / 形潜</text>
<text x="26" y="81" font-size="27" font-weight="600" fill="#24364b">将 CAD 描述编码为潜向量，检索可复用的样本</text>
<text x="26" y="114" font-size="14" fill="#3569a8">几何通道</text>
<text x="26" y="293" font-size="14" fill="#8766a9">结构通道</text><rect x="26" y="130" width="220" height="115" rx="10" fill="white" stroke="#d5deea"/><rect x="26" y="130" width="4" height="115" rx="2" fill="#3569a8"/><text x="44" y="174" font-size="19" fill="#24364b" font-weight="600">STEP 几何</text><text x="44" y="206" font-size="13" fill="#526477">CadQuery / OpenCascade</text><rect x="288" y="130" width="220" height="115" rx="10" fill="white" stroke="#d5deea"/><rect x="288" y="130" width="4" height="115" rx="2" fill="#3569a8"/><text x="306" y="174" font-size="19" fill="#24364b" font-weight="600">几何 VAE</text><text x="306" y="206" font-size="13" fill="#526477">44 维描述 → 8 维编码</text><rect x="550" y="130" width="220" height="115" rx="10" fill="white" stroke="#d5deea"/><rect x="550" y="130" width="4" height="115" rx="2" fill="#3569a8"/><text x="568" y="174" font-size="19" fill="#24364b" font-weight="600">几何潜向量</text><text x="568" y="206" font-size="13" fill="#526477">独立的模型参数与归一化</text><rect x="812" y="130" width="282" height="115" rx="10" fill="white" stroke="#d5deea"/><rect x="812" y="130" width="4" height="115" rx="2" fill="#3569a8"/><text x="830" y="174" font-size="19" fill="#24364b" font-weight="600">相似检索 / 描述重建</text><text x="830" y="206" font-size="13" fill="#526477">样本 ID、检索分数、描述向量</text><path d="M247 187H276" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M509 187H538" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M771 187H800" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="26" y="309" width="220" height="115" rx="10" fill="white" stroke="#d5deea"/><rect x="26" y="309" width="4" height="115" rx="2" fill="#8766a9"/><text x="44" y="353" font-size="19" fill="#24364b" font-weight="600">结构标签与数量</text><text x="44" y="385" font-size="13" fill="#526477">无序标签及数量特征</text><rect x="288" y="309" width="220" height="115" rx="10" fill="white" stroke="#d5deea"/><rect x="288" y="309" width="4" height="115" rx="2" fill="#8766a9"/><text x="306" y="353" font-size="19" fill="#24364b" font-weight="600">结构 VAE</text><text x="306" y="385" font-size="13" fill="#526477">21 个标签 + 2 个数量 → 8 维</text><rect x="550" y="309" width="220" height="115" rx="10" fill="white" stroke="#d5deea"/><rect x="550" y="309" width="4" height="115" rx="2" fill="#8766a9"/><text x="568" y="353" font-size="19" fill="#24364b" font-weight="600">结构潜向量</text><text x="568" y="385" font-size="13" fill="#526477">保留 SVD 基线作为对照</text><rect x="812" y="309" width="282" height="115" rx="10" fill="white" stroke="#d5deea"/><rect x="812" y="309" width="4" height="115" rx="2" fill="#8766a9"/><text x="830" y="353" font-size="19" fill="#24364b" font-weight="600">结构检索 / 标签重建</text><text x="830" y="385" font-size="13" fill="#526477">结构匹配、标签及数量输出</text><path d="M247 366H276" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M509 366H538" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M771 366H800" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><text x="26" y="461" font-size="13" fill="#526477">维数来自已记录的 DeepCAD 505 组实验；两套模型分别训练。解码输出是描述，不是完整 STEP/BRep 实体。</text></g></svg>