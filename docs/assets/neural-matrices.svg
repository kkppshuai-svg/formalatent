<title id="title">可训练神经 VAE 的矩阵和批量形状</title><desc id="desc">归一化输入、编码隐藏矩阵、后验均值和对数方差分支、重参数潜矩阵、解码器与描述输出。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8d9daf"/></marker></defs>
<rect width="1240" height="555" rx="14" fill="#f7f9fc"/>
<g font-family="Microsoft YaHei,DejaVu Sans,Arial,sans-serif"><text x="24" y="36" font-size="13" fill="#526477" font-weight="400">FORMALATENT / 可训练神经 VAE</text><text x="24" y="77" font-size="25" fill="#24364b" font-weight="600">可学习矩阵、非线性隐藏层与高斯后验</text><text x="24" y="109" font-size="14" fill="#526477" font-weight="400">几何配置：D = 44，H = 64，L = 8。N 表示当前批量大小。</text><rect x="24" y="220" width="150" height="110" rx="10" fill="white" stroke="#d5deea"/><rect x="24" y="220" width="4" height="110" rx="2" fill="#3569a8"/><text x="38" y="250" font-size="16" fill="#24364b" font-weight="600">输入 X</text><text x="38" y="279" font-size="18" fill="#3569a8" font-weight="600">N × 44</text><text x="38" y="304" font-size="11" fill="#526477" font-weight="400">训练域归一化</text><rect x="214" y="220" width="164" height="110" rx="10" fill="white" stroke="#d5deea"/><rect x="214" y="220" width="4" height="110" rx="2" fill="#3569a8"/><text x="228" y="250" font-size="16" fill="#24364b" font-weight="600">隐藏层 H1</text><text x="228" y="279" font-size="18" fill="#3569a8" font-weight="600">N × 64</text><text x="228" y="304" font-size="11" fill="#526477" font-weight="400">tanh(X @ w1 + b1)</text><rect x="428" y="140" width="186" height="98" rx="10" fill="white" stroke="#d5deea"/><rect x="428" y="140" width="4" height="98" rx="2" fill="#8766a9"/><text x="442" y="170" font-size="16" fill="#24364b" font-weight="600">后验均值 μ</text><text x="442" y="199" font-size="18" fill="#8766a9" font-weight="600">N × 8</text><text x="442" y="224" font-size="11" fill="#526477" font-weight="400">H1 @ w_mu + b_mu</text><rect x="428" y="310" width="186" height="98" rx="10" fill="white" stroke="#d5deea"/><rect x="428" y="310" width="4" height="98" rx="2" fill="#8766a9"/><text x="442" y="340" font-size="16" fill="#24364b" font-weight="600">对数方差 ℓ</text><text x="442" y="369" font-size="18" fill="#8766a9" font-weight="600">N × 8</text><text x="442" y="394" font-size="11" fill="#526477" font-weight="400">clip(H1 @ w_lv + b_lv)</text><rect x="670" y="220" width="160" height="110" rx="10" fill="white" stroke="#d5deea"/><rect x="670" y="220" width="4" height="110" rx="2" fill="#8766a9"/><text x="684" y="250" font-size="16" fill="#24364b" font-weight="600">潜矩阵 Z</text><text x="684" y="279" font-size="18" fill="#8766a9" font-weight="600">N × 8</text><text x="684" y="304" font-size="11" fill="#526477" font-weight="400">μ + exp(ℓ/2) ⊙ ε</text><rect x="886" y="220" width="156" height="110" rx="10" fill="white" stroke="#d5deea"/><rect x="886" y="220" width="4" height="110" rx="2" fill="#3569a8"/><text x="900" y="250" font-size="16" fill="#24364b" font-weight="600">隐藏层 H2</text><text x="900" y="279" font-size="18" fill="#3569a8" font-weight="600">N × 64</text><text x="900" y="304" font-size="11" fill="#526477" font-weight="400">tanh(Z @ w2 + b2)</text><rect x="1084" y="220" width="132" height="110" rx="10" fill="white" stroke="#d5deea"/><rect x="1084" y="220" width="4" height="110" rx="2" fill="#287b6b"/><text x="1098" y="250" font-size="16" fill="#24364b" font-weight="600">归一化输出</text><text x="1098" y="279" font-size="18" fill="#287b6b" font-weight="600">N × 44</text><text x="1098" y="304" font-size="11" fill="#526477" font-weight="400">H2 @ w_out + b_out</text><path d="M176 275H208" fill="none" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M380 275H403V189H422" fill="none" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M403 275V359H422" fill="none" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M616 189H644V275H664" fill="none" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M616 359H644V275" fill="none" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M832 275H880" fill="none" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M1044 275H1078" fill="none" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><text x="214" y="354" font-size="12" fill="#526477" font-weight="400">w1: 44 × 64</text><text x="214" y="376" font-size="12" fill="#526477" font-weight="400">b1: 64</text><text x="438" y="262" font-size="12" fill="#526477" font-weight="400">w_mu: 64 × 8; b_mu: 8</text><text x="438" y="432" font-size="12" fill="#526477" font-weight="400">w_lv: 64 × 8; b_lv: 8</text><text x="886" y="354" font-size="12" fill="#526477" font-weight="400">w2: 8 × 64</text><text x="886" y="376" font-size="12" fill="#526477" font-weight="400">b2: 64</text><text x="1075" y="354" font-size="12" fill="#526477" font-weight="400">w_out: 64 × 44</text><text x="1075" y="376" font-size="12" fill="#526477" font-weight="400">b_out: 44</text><path d="M24 452H1216" stroke="#d5deea"/><text x="24" y="480" font-size="14" fill="#24364b" font-weight="400">训练：重参数采样 + KL 正则。确定性推理：Z = μ。</text><text x="24" y="506" font-size="13" fill="#526477" font-weight="400">共 7,356 个可训练参数（含偏置）。线性输出反归一化后得到描述，不是完整 STEP 实体。</text><text x="24" y="533" font-size="12" fill="#526477" font-weight="400">核心：Python / NumPy · STEP：CadQuery / OpenCascade · 测试：pytest · AI-CAD 接入：JavaScript</text></g></svg>