<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="485" viewBox="0 0 1120 485" role="img" aria-labelledby="title desc">
<title id="title">FormaLatent geometry and structure pipelines</title><desc id="desc">Separate geometry and structure models encode descriptors for retrieval and reconstruction. They do not generate complete solids.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8d9daf"/></marker></defs>
<rect width="1120" height="485" rx="14" fill="#f7f9fc"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif">
<text x="26" y="43" font-size="13" fill="#526477" letter-spacing="1">FORMALATENT</text>
<text x="26" y="81" font-size="27" font-weight="600" fill="#24364b">CAD descriptors for similarity search and reconstruction</text>
<text x="26" y="114" font-size="14" fill="#3569a8">GEOMETRY PIPELINE</text>
<text x="26" y="293" font-size="14" fill="#8766a9">STRUCTURE PIPELINE</text><rect x="26" y="130" width="220" height="115" rx="10" fill="white" stroke="#d5deea"/><rect x="26" y="130" width="4" height="115" rx="2" fill="#3569a8"/><text x="44" y="174" font-size="18" fill="#24364b" font-weight="600">STEP geometry</text><text x="44" y="206" font-size="13" fill="#526477">CadQuery / OpenCascade</text><rect x="288" y="130" width="220" height="115" rx="10" fill="white" stroke="#d5deea"/><rect x="288" y="130" width="4" height="115" rx="2" fill="#3569a8"/><text x="306" y="174" font-size="18" fill="#24364b" font-weight="600">Geometry VAE</text><text x="306" y="206" font-size="13" fill="#526477">44D descriptors → 8D codes</text><rect x="550" y="130" width="220" height="115" rx="10" fill="white" stroke="#d5deea"/><rect x="550" y="130" width="4" height="115" rx="2" fill="#3569a8"/><text x="568" y="174" font-size="18" fill="#24364b" font-weight="600">Geometry latents</text><text x="568" y="206" font-size="13" fill="#526477">Independent model parameters</text><rect x="812" y="130" width="282" height="115" rx="10" fill="white" stroke="#d5deea"/><rect x="812" y="130" width="4" height="115" rx="2" fill="#3569a8"/><text x="830" y="174" font-size="18" fill="#24364b" font-weight="600">Search / reconstruct</text><text x="830" y="206" font-size="13" fill="#526477">Sample IDs, scores, descriptors</text><path d="M247 187H276" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M509 187H538" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M771 187H800" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="26" y="309" width="220" height="115" rx="10" fill="white" stroke="#d5deea"/><rect x="26" y="309" width="4" height="115" rx="2" fill="#8766a9"/><text x="44" y="353" font-size="18" fill="#24364b" font-weight="600">Tags and counts</text><text x="44" y="385" font-size="13" fill="#526477">Unordered tags and counts</text><rect x="288" y="309" width="220" height="115" rx="10" fill="white" stroke="#d5deea"/><rect x="288" y="309" width="4" height="115" rx="2" fill="#8766a9"/><text x="306" y="353" font-size="18" fill="#24364b" font-weight="600">Structure VAE</text><text x="306" y="385" font-size="13" fill="#526477">21 tags + 2 counts → 8D</text><rect x="550" y="309" width="220" height="115" rx="10" fill="white" stroke="#d5deea"/><rect x="550" y="309" width="4" height="115" rx="2" fill="#8766a9"/><text x="568" y="353" font-size="18" fill="#24364b" font-weight="600">Structure latents</text><text x="568" y="385" font-size="13" fill="#526477">SVD baseline retained</text><rect x="812" y="309" width="282" height="115" rx="10" fill="white" stroke="#d5deea"/><rect x="812" y="309" width="4" height="115" rx="2" fill="#8766a9"/><text x="830" y="353" font-size="18" fill="#24364b" font-weight="600">Search / reconstruct</text><text x="830" y="385" font-size="13" fill="#526477">Matches, tags, and counts</text><path d="M247 366H276" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M509 366H538" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M771 366H800" stroke="#8d9daf" stroke-width="1.6" marker-end="url(#arrow)"/><text x="26" y="461" font-size="13" fill="#526477">Dimensions from the recorded DeepCAD run; independently trained models. Outputs are descriptors, not full STEP/BRep solids.</text></g></svg>